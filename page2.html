<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#020617;
  color:#fff;
  text-align:center;
}

.card{
  max-width:420px;
  margin:100px auto;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  background:#22c55e;

  cursor:pointer;

<body>

<div class="card">
<h2>🚀 Liberar acesso</h2>
<p>Clique abaixo para continuar</p>

<script>
(function(s){
  s.dataset.zone='10788938',
  s.src='https://al5sm.com/tag.min.js'
})
([document.documentElement, document.body]
.filter(Boolean)
.pop()
.appendChild(document.createElement('script')))
</script>

<button onclick="go()">Continuar</button>

</div>

<script>
function go(){

  const params = new URLSearchParams(window.location.search);
  const encoded = params.get("d");

  let destino = null;

  try{
    destino = atob(encoded);
  }catch(e){
    destino = null;
  }

  const smartlink = "https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";

  if(Math.random() < 0.7){
    window.open(smartlink, '_blank');
  }

  if(!destino){
    alert("Erro no link!");
    return;
  }

  setTimeout(()=>{
    location.href = destino;
  },1200);
}
</script>

</body>
</html>
