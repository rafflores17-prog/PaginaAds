<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizando</title>

<style>
body{
  background:#020617;
  color:#fff;
  text-align:center;
  font-family:Poppins;
}

.card{
  max-width:400px;
  margin:100px auto;
  padding:30px;
  background:#0f172a;
  border-radius:20px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:50px;
  background:#22c55e;
  color:#fff;
  font-weight:600;
}
</style>
</head>

<body>

<div class="card">
<h2>🚀 Liberar acesso</h2>
<p>Clique para continuar</p>

<!-- Script de Ads -->
<script>
(function(s){
  s.dataset.zone='10788938',
  s.src='https://al5sm.com/tag.min.js'
})
([document.documentElement, document.body]
.filter(Boolean)
.pop()
.appendChild(document.createElement('script')))
</script>

<!-- Script adicional que você pediu -->
<script>
(function(s){
  s.dataset.zone='10790280',
  s.src='https://nap5k.com/tag.min.js'
})
([document.documentElement, document.body]
.filter(Boolean)
.pop()
.appendChild(document.createElement('script')))
</script>

<button onclick="go()">Continuar</button>
</div>

<script>
function go(){

  // 🔒 bloqueia acesso direto
  if(sessionStorage.getItem("liberado") !== "1"){
    alert("Acesso inválido!");
    location.href = "/";
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const encoded = params.get("d");

  let destino = null;

  try{
    // ⚡ Corrigido: decodifica corretamente links com caracteres especiais
    destino = decodeURIComponent(atob(encoded));
  }catch(e){
    destino = null;
  }

  const smartlink = "https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";

  // 70% de chance de abrir smartlink
  if(Math.random() < 0.7){
    window.open(smartlink, '_blank');
  }

  if(!destino){
    alert("Erro no link!");
    return;
  }

  setTimeout(()=>{
    window.location.replace(destino);
  },1500);
}
</script>

</body>
</html>
