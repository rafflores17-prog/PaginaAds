<script>
const links = {
  "abc123": "https://devuploads.com/36lgeo3f83ct",
  "test1": "https://google.com"
};

function go(){

  if(sessionStorage.getItem("liberado") !== "1"){
    alert("Acesso inválido!");
    location.href = "/";
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const destino = links[id];

  if(!destino){
    alert("Link inválido!");
    return;
  }

  const smartlink = "https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";

  if(Math.random() < 0.5){
    window.open(smartlink, '_blank');
  }

  setTimeout(()=>{
    window.location.replace(destino);
  },1500);
}
</script>
