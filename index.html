<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo de Segurança</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<script src="https://quge5.com/88/tag.min.js" data-zone="223644" async data-cfasync="false"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="223718" async data-cfasync="false"></script>
<script type='text/javascript' src='https://encouragingjawsordinarily.com/09/bc/0d/09bc0d1e4e41282a10b229106cc5a841.js'></script>

<style>
    :root { --blue: #0088cc; --green: #22c55e; --dark: #020617; }
    
    body { 
        background-color: var(--dark); 
        background-image: linear-gradient(rgba(0, 136, 204, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 136, 204, 0.1) 1px, transparent 1px);
        background-size: 30px 30px;
        color: #fff; font-family: 'Roboto', sans-serif; margin: 0; padding: 0 20px 100px 20px;
        display: flex; flex-direction: column; align-items: center;
    }

    .top-spacer { height: 130px; } /* Espaço para fugir das popups */
    
    .card { background: #fff; color: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 25px; margin: 40px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; }
    
    .status-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border-left: 5px solid var(--blue); margin-bottom: 15px; text-align: left; font-size: 14px; }
    
    .progress-bar { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
    .fill { width: 5%; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width 0.5s ease; }

    button { 
        width: 100%; padding: 22px; border: none; border-radius: 14px; 
        font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-step { background: var(--blue); color: #fff; box-shadow: 0 6px 0 #005f8d; }
    
    /* ANIMAÇÃO DE PULSAR QUANDO ATIVO */
    .pulse-active:not(:disabled) {
        animation: pulse-blue 2s infinite;
    }

    @keyframes pulse-blue {
        0% { transform: scale(1); box-shadow: 0 6px 0 #005f8d; }
        50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 136, 204, 0.6); }
        100% { transform: scale(1); box-shadow: 0 6px 0 #005f8d; }
    }

    .btn-step:disabled { background: #64748b; box-shadow: none; color: #cbd5e1; cursor: not-allowed; }
    
    #ab-alert { display: none; background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 13px; border: 1px solid #fca5a5; text-align: center; }
</style>
</head>
<body>

    <div class="top-spacer"></div>

    <div id="pos-1" style="width:100%; max-width:450px;">
        <div id="ab-alert">⚠️ SISTEMA TRAVADO: Desative o AdBlock para liberar.</div>
        <button id="main-btn" class="btn-step pulse-active" disabled>AGUARDE A ANALISE...</button>
    </div>

    <div id="main-card" class="card">
        <div class="status-box">
            <b>🛡️ Verificação de Link Criptografado</b><br>
            Status: <span id="scan-text" style="color:var(--blue)">Aguardando início...</span>
        </div>
        <div class="progress-bar"><div id="fill" class="fill"></div></div>
        <div id="pos-2"></div>
    </div>

    <div style="min-height: 100px; margin: 20px 0;">
        <script async="async" data-cfasync="false" src="https://encouragingjawsordinarily.com/694579ced308045c2c6c156cc2dceaba/invoke.js"></script>
        <div id="container-694579ced308045c2c6c156cc2dceaba"></div>
    </div>

    <div style="height: 120px;"></div>
    <div id="pos-3" style="width:100%; max-width:450px;"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    let target = params.get("d") || params.get("destino") || sessionStorage.getItem("dest_final");

    if(target) {
        sessionStorage.setItem("dest_final", target);
        window.history.replaceState({}, document.title, window.location.pathname);
    } else {
        document.body.innerHTML = "<div style='color:white;text-align:center;padding-top:100px'><h2>Link Inválido.</h2></div>";
    }

    const btn = document.getElementById("main-btn");
    const fill = document.getElementById("fill");
    const scan = document.getElementById("scan-text");
    const abAlert = document.getElementById("ab-alert");

    window.onload = () => {
        let attempts = 0;
        const check = setInterval(() => {
            attempts++;
            const ad = document.getElementById("container-694579ced308045c2c6c156cc2dceaba").innerHTML.length > 20;
            if(ad) {
                clearInterval(check);
                btn.disabled = false;
                btn.innerText = "INICIAR VERIFICAÇÃO";
                abAlert.style.display = "none";
            } else if (attempts > 6) {
                abAlert.style.display = "block";
                btn.innerText = "ADBLOCK DETECTADO";
            }
        }, 1000);
    };

    btn.onclick = function() {
        window.open("https://omg10.com/4/9975998", "_blank");
        this.disabled = true;
        fill.style.width = "45%";
        scan.innerText = "Etapa 1 concluída. Validando...";

        let timer = 3;
        const count = setInterval(() => {
            timer--;
            this.innerText = `AGUARDE ${timer}s...`;
            if(timer <= 0) {
                clearInterval(count);
                document.getElementById("pos-2").appendChild(this);
                this.innerText = "PROSSEGUIR PARA O FINAL";
                this.disabled = false;
                window.scrollTo({ top: document.getElementById("main-card").offsetTop - 20, behavior: 'smooth' });
                this.onclick = etapaFinal;
            }
        }, 1000);
    };

    function etapaFinal() {
        window.open("https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f", "_blank");
        this.disabled = true;
        fill.style.width = "100%";
        scan.innerText = "Verificação Completa!";

        setTimeout(() => {
            document.getElementById("pos-3").appendChild(this);
            this.innerText = "ACESSAR AGORA";
            this.style.background = "#22c55e";
            this.style.boxShadow = "0 6px 0 #16a34a";
            this.disabled = false;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            this.onclick = () => {
                const final = decodeURIComponent(atob(sessionStorage.getItem("dest_final")));
                window.location.replace(final);
            };
        }, 2000);
    }
</script>
</body>
</html>
