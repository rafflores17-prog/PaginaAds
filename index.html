<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Seguro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:#fff;
  text-align:center;
}

.container{
  padding:50px 20px;
}

.card{
  max-width:420px;
  margin:auto;
  padding:30px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.progress{
  height:10px;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  margin:25px 0;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  transition:width 1s linear;
}

button{
  width:100%;
  padding:15px;
  border-radius:50px;
  border:none;
  background:#334155;
  color:#fff;
  font-weight:600;
  cursor:not-allowed;
  transition:0.2s;
}

button.active{
  background:linear-gradient(90deg,#06b6d4,#3b82f6);
  cursor:pointer;
}

button.active:hover{
  transform:scale(1.05);
}

.footer{
  margin-top:30px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h2>🔐 Verificando acesso</h2>
    <p>Preparando seu conteúdo exclusivo...</p>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <p id="status">Iniciando...</p>

    <button id="btn" disabled>Continuar</button>

    <div class="footer">
      © 2026 - Todos os direitos reservados<br>
      Política de Privacidade | Termos de Uso
    </div>
  </div>
</div>

<script>
let tempo = Math.floor(Math.random() * 5) + 9;
let atual = 0;

const bar = document.getElementById("bar");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

const textos = [
 "Conectando servidor...",
 "Verificando segurança...",
 "Carregando conteúdo...",
 "Finalizando acesso..."
];

let i = setInterval(() => {
 atual++;

 bar.style.width = (atual / tempo * 100) + "%";
 status.innerText = textos[Math.floor(atual/3)] || "Finalizando...";

 if(atual >= tempo){
  clearInterval(i);

  btn.disabled = false;
  btn.classList.add("active");

  btn.onclick = () => {
    const params = new URLSearchParams(window.location.search);
    const destino = params.get("destino");

    if(!destino){
      alert("Link inválido! Gere novamente.");
      return;
    }

    location.href = "page2.html?destino=" + encodeURIComponent(destino);
  };
 }
}, 1000);
</script>

</body>
</html>
