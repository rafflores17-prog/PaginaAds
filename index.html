<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ADS Futurista Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #06b6d4;
  --secondary: #3b82f6;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #020617;
  /* Efeito de iluminação no fundo */
  background-image: 
    radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container { width: 100%; padding: 20px; }

.card {
  max-width: 450px;
  margin: auto;
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(12px); /* Efeito Vidro */
  padding: 40px 30px;
  border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.progress-container {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

#progress-bar {
  width: 10%;
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  transition: width 0.5s ease;
}

h2 { font-weight: 700; font-size: 1.8em; margin-bottom: 5px; letter-spacing: -1px; }
#status { color: #94a3b8; font-size: 0.95em; margin-bottom: 25px; }

button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.4);
}

button:hover { transform: translateY(-2px); filter: brightness(1.1); }
button:active { transform: translateY(0); }
button:disabled { background: #1e293b; color: #475569; cursor: not-allowed; box-shadow: none; }

#ad-banner { 
  margin: 25px auto 0; 
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

/* Modal Anti-AdBlock Premium */
#adblock-popup {
  display:none;
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(2, 6, 23, 0.98);
  z-index: 9999;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

#adblock-popup .icon { font-size: 60px; margin-bottom: 20px; }

.footer { margin-top: 30px; font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🔐 Acesso VIP</h2>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <p id="status">Verificando segurança...</p>
    
    <div id="step-area">
        <button id="btn1" disabled>Iniciar Verificação</button>
    </div>

    <div id="ad-banner">
      <script>atOptions={'key':'2f2aa93bee1aa52954a8f17f3434c3db','format':'iframe','height':50,'width':320,'params':{}};</script>
      <script src="https://encouragingjawsordinarily.com/2f2aa93bee1aa52954a8f17f3434c3db/invoke.js"></script>
    </div>

    <div class="footer">Encrypted & Secure © 2026</div>
  </div>
</div>

<div id="adblock-popup">
  <div class="icon">🛑</div>
  <h2 style="color:#ef4444">Bloqueador Ativo!</h2>
  <p style="color:#94a3b8; max-width:300px">Nosso portal requer a exibição de anúncios para manter o acesso gratuito. Por favor, desative o AdBlock e recarregue.</p>
  <button onclick="location.reload()" style="max-width:200px; background:#22c55e">Recarregar Página</button>
</div>

<script>
// Mantendo sua lógica de URL
const params = new URLSearchParams(window.location.search);
let encoded = params.get("d") || params.get("destino");
if(!encoded){ alert("Link inválido!"); throw new Error(); }
window.history.replaceState({}, document.title, window.location.pathname);

const btn1 = document.getElementById("btn1");
const status = document.getElementById("status");
const stepArea = document.getElementById("step-area");
const progressBar = document.getElementById("progress-bar");
const adblockPopup = document.getElementById("adblock-popup");

// Verificação de AdBlock Melhorada
window.addEventListener("load", () => {
  let adTest = document.createElement('div');
  adTest.className = 'ad-banner ads sponsor pub_300x250';
  adTest.style = 'position:absolute; top:-999px; height:1px; width:1px;';
  document.body.appendChild(adTest);

  setTimeout(() => {
    if (adTest.offsetHeight === 0) {
      adblockPopup.style.display = 'flex';
    } else {
      btn1.disabled = false;
      status.innerText = "Pronto para liberar seu acesso";
      progressBar.style.width = "30%";
    }
    adTest.remove();
  }, 700);
});

// LÓGICA DE ETAPAS (Igual a sua, apenas com visual melhorado)
btn1.onclick = () => {
  stepArea.innerHTML = '<button id="btn-timer" disabled>Preparando (3s)</button>';
  status.innerText = "Iniciando protocolos...";
  progressBar.style.width = "50%";

  let count = 3;
  const timer1 = setInterval(() => {
    count--;
    const btn = document.getElementById("btn-timer");
    btn.innerText = `Aguarde (${count}s)`;
    if(count <= 0) {
      clearInterval(timer1);
      btn.innerText = "Avançar Etapa";
      btn.disabled = false;
      btn.onclick = etapa2;
    }
  }, 1000);
};

function etapa2() {
  stepArea.innerHTML = '<button id="btn-timer-2" disabled>Processando (3s)</button>';
  status.innerText = "Validando tokens de segurança...";
  progressBar.style.width = "80%";

  // Pop-up Monetização (Seu link)
  window.open("https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f", '_blank');

  let count = 3;
  const timer2 = setInterval(() => {
    count--;
    const btn = document.getElementById("btn-timer-2");
    btn.innerText = `Processando (${count}s)`;
    if(count <= 0) {
      clearInterval(timer2);
      btn.innerText = "Liberar Destino Agora";
      btn.disabled = false;
      btn.onclick = finalStep;
    }
  }, 1000);
}

function finalStep() {
  status.innerText = "Acesso concedido!";
  progressBar.style.width = "100%";
  stepArea.innerHTML = '<button id="btn-final">Acessar Link Final</button>';
  
  document.getElementById("btn-final").onclick = () => {
    try {
      const destino = decodeURIComponent(atob(encoded));
      window.location.replace(destino);
    } catch(e) {
      alert("Erro ao processar link.");
    }
  };
}
</script>
</body>
</html>
