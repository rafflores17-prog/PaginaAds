<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo de Segurança</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<script src="https://quge5.com/88/tag.min.js" data-zone="223644" async data-cfasync="false"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="223718" async data-cfasync="false"></script>
<script type='text/javascript' src='https://encouragingjawsordinarily.com/09/bc/0d/09bc0d1e4e41282a10b229106cc5a841.js'></script>

<style>
    :root { --blue: #0088cc; --green: #22c55e; --dark: #020617; }
    
    body { 
        background-color: var(--dark); 
        background-image: 
            linear-gradient(rgba(0, 136, 204, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 136, 204, 0.1) 1px, transparent 1px);
        background-size: 30px 30px;
        color: #fff; font-family: 'Roboto', sans-serif; margin: 0; 
        padding: 0 20px 100px 20px; /* Padding no fundo para não colar no rodapé */
        display: flex; flex-direction: column; align-items: center;
    }

    /* ESPAÇO PARA AS POP-UPS NÃO COBRIREM O BOTÃO NO TOPO */
    .top-spacer { height: 120px; width: 100%; }
    
    .ad-slot { width: 100%; max-width: 400px; min-height: 100px; margin: 20px 0; background: rgba(255,255,255,0.03); border: 1px dashed #334155; display: flex; align-items: center; justify-content: center; border-radius: 8px; }

    .card { background: #fff; color: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; margin: 40px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
    
    .status-box { background: #f1f5f9; padding: 15px; border-radius: 10px; border-left: 5px solid var(--blue); margin-bottom: 15px; text-align: left; }
    
    .progress-bar { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin: 15px 0; }
    .fill { width: 5%; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width 0.5s ease; }

    button { 
        width: 100%; padding: 22px; border: none; border-radius: 14px; 
        font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        z-index: 99; position: relative;
    }
    .btn-step { background: var(--blue); color: #fff; box-shadow: 0 6px 0 #005f8d; text-transform: uppercase; letter-spacing: 1px; }
    .btn-step:active { transform: translateY(3px); box-shadow: 0 3px 0 #005f8d; }
    .btn-step:disabled { background: #64748b; box-shadow: none; color: #cbd5e1; cursor: not-allowed; }
    
    #ab-alert { display: none; background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 13px; border: 1px solid #fca5a5; }
</style>
</head>
<body>

    <div class="top-spacer"></div>

    <div id="pos-1" style="width:100%; max-width:450px;">
        <div id="ab-alert">⚠️ BLOQUEADOR ATIVO: Desative para liberar o link.</div>
        <button id="main-btn" class="btn-step" disabled>VERIFICANDO SEGURANÇA...</button>
    </div>

    <div id="main-card" class="card">
        <div class="status-box">
            <b>🛡️ Verificação de Link</b><br>
            Status: <span id="scan-text" style="color:var(--blue)">Aguardando início...</span>
        </div>
        <div class="progress-bar"><div id="fill" class="fill"></div></div>
        <div id="pos-2"></div> </div>

    <div class="ad-slot">
        <script async="async" data-cfasync="false" src="https://encouragingjawsordinarily.com/694579ced308045c2c6c156cc2dceaba/invoke.js"></script>
        <div id="container-694579ced308045c2c6c156cc2dceaba"></div>
    </div>

    <div style="height: 150px;"></div>

    <div id="pos-3" style="width:100%; max-width:450px;"></div> <script>
    const params = new URLSearchParams(window.location.search);
    let target = params.get("d") || params.get("destino") || sessionStorage.getItem("final_dest");

    if(target) {
        sessionStorage.setItem("final_dest", target);
        window.history.replaceState({}, document.title, window.location.pathname);
    } else {
        document.body.innerHTML = "<div style='padding-top:100px;text-align:center;'><h2>Link Expirado.</h2></div>";
    }

    const btn = document.getElementById("main-btn");
    const fill = document.getElementById("fill");
    const scan = document.getElementById("scan-text");
    const abAlert = document.getElementById("ab-alert");

    // ANTI-ADBLOCK MELHORADO
    window.onload = () => {
        let checkCount = 0;
        const checkAds = setInterval(() => {
            checkCount++;
            const adLoaded = document.getElementById("container-694579ced308045c2c6c156cc2dceaba").innerHTML.length > 20;
            
            if(adLoaded) {
                clearInterval(checkAds);
                btn.disabled = false;
                btn.innerText = "INICIAR VERIFICAÇÃO";
                abAlert.style.display = "none";
            } else if (checkCount > 6) {
                abAlert.style.display = "block";
                btn.innerText = "ADBLOCK DETECTADO";
            }
        }, 1000);
    };

    btn.onclick = function() {
        window.open("https://omg10.com/4/9975998", "_blank");
        this.disabled = true;
        fill.style.width = "40%";
        scan.innerText = "Validando Etapa 1/2...";

        let timer = 3;
        const countdown = setInterval(() => {
            timer--;
            this.innerText = `AGUARDE ${timer}s...`;
            if(timer <= 0) {
                clearInterval(countdown);
                document.getElementById("pos-2").appendChild(this);
                this.innerText = "PROSSEGUIR PARA ETAPA FINAL";
                this.disabled = false;
                window.scrollTo({ top: document.getElementById("main-card").offsetTop - 20, behavior: 'smooth' });
                this.onclick = etapaFinal;
            }
        }, 1000);
    };

    function etapaFinal() {
        window.open("https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f", "_blank");
        this.disabled = true;
        fill.style.width = "100%";
        scan.innerText = "Link Verificado!";

        setTimeout(() => {
            document.getElementById("pos-3").appendChild(this);
            this.innerText = "ACESSAR DESTINO";
            this.style.background = "#22c55e";
            this.style.boxShadow = "0 6px 0 #16a34a";
            this.disabled = false;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            this.onclick = () => {
                const finalUrl = decodeURIComponent(atob(sessionStorage.getItem("final_dest")));
                window.location.replace(finalUrl);
            };
        }, 2000);
    }
</script>
</body>
</html>
