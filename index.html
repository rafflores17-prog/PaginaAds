<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#0f172a;
  color:#fff;
  text-align:center;
}

.container{
  padding:60px 20px;
}

.card{
  max-width:420px;
  margin:auto;
  background:#020617;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:50px;
  background:linear-gradient(90deg,#06b6d4,#3b82f6);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

#ad{
  margin-top:20px;
}

.footer{
  margin-top:20px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h2>🔐 Acesso Protegido</h2>
    <p id="status">Clique abaixo para liberar</p>

    <button id="btn1">Liberar Acesso</button>

    <div id="step2"></div>

    <!-- BANNER FIXO -->
    <div id="ad">
      <script>
        atOptions = {
          'key' : '2f2aa93bee1aa52954a8f17f3434c3db',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://encouragingjawsordinarily.com/2f2aa93bee1aa52954a8f17f3434c3db/invoke.js"></script>
    </div>

    <div class="footer">© 2026 Sistema Premium</div>

  </div>
</div>

<script>
// ===== DESTINO FLEXÍVEL =====
const params = new URLSearchParams(window.location.search);
let encoded = params.get("d") || params.get("destino");

if(!encoded){
  alert("Link inválido!");
  throw new Error();
}

// limpa URL
window.history.replaceState({}, document.title, window.location.pathname);

// ===== ETAPA 1 =====
const btn1 = document.getElementById("btn1");
const step2 = document.getElementById("step2");

btn1.onclick = ()=>{
  btn1.style.display = "none";

  let count = 3;
  const btn2 = document.createElement("button");
  btn2.innerText = "Aguarde 3s...";
  step2.appendChild(btn2);

  const timer = setInterval(()=>{
    count--;
    btn2.innerText = "Aguarde "+count+"s...";

    if(count <= 0){
      clearInterval(timer);
      btn2.innerText = "Continuar";
      btn2.onclick = final;
    }

  },1000);
};

// ===== FINAL =====
function final(){

  // popup monetização
  const smartlink = "https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";
  if(Math.random() < 0.7){
    window.open(smartlink,'_blank');
  }

  const destino = decodeURIComponent(atob(encoded));

  setTimeout(()=>{
    window.location.replace(destino);
  },1000);
}
</script>

</body>
</html>
