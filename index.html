<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ADS Futurista - Ultra Final</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Poppins;background:#0f172a;color:#fff;text-align:center;transition:0.3s;}
header{position:fixed;top:0;width:100%;padding:15px 30px;background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;z-index:1000;}
header h1{font-size:1.6rem;color:#06b6d4;}
.toggle-dark{cursor:pointer;font-weight:600;padding:8px 12px;border-radius:12px;background:#22c55e;color:#fff;}
main{padding:120px 20px 50px;}
.progress{height:10px;background:#1e293b;border-radius:20px;overflow:hidden;margin:20px 0;}
.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#06b6d4);}
.steps{margin-top:30px;}
.button{display:inline-block;margin:15px 0;padding:15px 25px;background:linear-gradient(90deg,#06b6d4,#3b82f6);color:#fff;font-weight:600;border-radius:50px;cursor:pointer;font-size:1rem;transition:0.2s;}
.button:hover{opacity:0.9;transform:scale(1.03);}
.ad-banner{margin:20px auto;text-align:center;}
footer{margin-top:30px;font-size:12px;color:#888;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:2000;}
.modal-content{background:#0f172a;padding:30px;border-radius:20px;max-width:500px;width:90%;text-align:center;position:relative;}
.modal-content h2{color:#06b6d4;margin-bottom:15px;}
.modal-content p{color:#fff;margin-bottom:20px;}
.modal-close{position:absolute;top:10px;right:15px;color:#fff;font-size:20px;cursor:pointer;}
</style>
</head>
<body>

<header>
<h1>📰 Portal ADS Futurista</h1>
<div class="toggle-dark" onclick="toggleDark()">Dark Mode</div>
</header>

<div class="progress"><div class="bar" id="bar"></div></div>
<p id="status">Iniciando...</p>

<main>
<div class="steps" id="steps">
  <div class="button" id="btn1" style="display:none">Liberar Acesso</div>
</div>

<!-- ADS FIXO TOPO -->
<div class="ad-banner" id="ad-top"></div>
<!-- ADS FIXO INTERMEDIO -->
<div class="ad-banner" id="ad-middle"></div>
<!-- ADS FIXO RODAPE -->
<div class="ad-banner" id="ad-bottom"></div>
</main>

<footer>© 2026 Portal ADS Futurista Premium</footer>

<!-- MODAL FINAL -->
<div class="modal" id="modal">
<div class="modal-content">
<span class="modal-close" id="modal-close">&times;</span>
<h2 id="modal-title">Acesso Liberado!</h2>
<p id="modal-text">Clique no botão abaixo para continuar para o conteúdo.</p>
<div class="button" id="modal-btn">Continuar</div>
</div>
</div>

<script>
// DARK MODE
function toggleDark(){
  if(document.body.style.background=="#0f172a"){
    document.body.style.background="#fff";document.body.style.color="#111";
  }else{
    document.body.style.background="#0f172a";document.body.style.color="#fff";
  }
}

// DESTINO SEGURO
const params = new URLSearchParams(window.location.search);
let destino = params.get("destino") || "https://devuploads.com/36lgeo3f83ct"; // fallback
const encoded = btoa(encodeURIComponent(destino));
sessionStorage.setItem("liberado","1");

// PROGRESSO
let tempo = Math.floor(Math.random()*4)+4;
let atual=0;
const bar=document.getElementById("bar");
const status=document.getElementById("status");
const btn1=document.getElementById("btn1");
let i = setInterval(()=>{
  atual++;
  bar.style.width = (atual/tempo*100)+"%";
  if(atual<tempo/2) status.innerText="Conectando...";
  else status.innerText="Verificando...";
  if(atual>=tempo){
    clearInterval(i);
    status.innerText="Acesso Liberado! Clique no botão.";
    btn1.style.display="inline-block";
  }
},1000);

// BOTÕES DE ETAPAS
const stepsContainer=document.getElementById("steps");
btn1.onclick = ()=>{
  btn1.style.display="none";
  // Etapa 2 - contagem 3s
  const btn2=document.createElement("div");
  btn2.className="button";
  btn2.innerText="Aguarde 3s...";
  stepsContainer.appendChild(btn2);

  let count=3;
  const countInterval = setInterval(()=>{
    count--;
    btn2.innerText="Aguarde "+count+"s...";
    if(count<=0){
      clearInterval(countInterval);
      btn2.innerText="Clique para continuar";
      btn2.onclick = ()=> finalStep();
    }
  },1000);
};

// FINAL STEP
function finalStep(){
  // modal com botão final
  document.getElementById("modal").style.display="flex";
}

const modalClose=document.getElementById("modal-close");
modalClose.onclick=()=>{document.getElementById("modal").style.display="none";};

const modalBtn=document.getElementById("modal-btn");
modalBtn.onclick = ()=>{
  // Pop-up smartlink 70%
  const smartlink="https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";
  if(Math.random()<0.7) window.open(smartlink,'_blank');
  
  // Redireciona para o destino real (oculto)
  const finalDest = decodeURIComponent(atob(encoded));
  window.location.replace(finalDest);
};

// INSERIR ADS FIXOS (topo, meio, rodapé)
function loadAds(){
  const adTop=document.getElementById("ad-top");
  const adMiddle=document.getElementById("ad-middle");
  const adBottom=document.getElementById("ad-bottom");

  const scripts = [
    {src:"https://quge5.com/88/tag.min.js", attrs:{ "data-zone":"223644", async:true, "data-cfasync":"false" }},
    {src:"https://encouragingjawsordinarily.com/09/bc/0d/09bc0d1e4e41282a10b229106cc5a841.js", attrs:{}},
    {src:"https://nap5k.com/tag.min.js", attrs:{ "data-zone":"10790280" }},
    {src:"https://5gvci.com/act/files/tag.min.js?z=10788960", attrs:{async:true}}
  ];

  [adTop, adMiddle, adBottom].forEach((container)=>{
    scripts.forEach((s)=>{
      const scr=document.createElement("script");
      scr.src=s.src;
      for(const key in s.attrs) scr.setAttribute(key,s.attrs[key]);
      container.appendChild(scr);
    });
  });
}
loadAds();
</script>

</body>
</html>
