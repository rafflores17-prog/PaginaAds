<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Seguro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;background:#0f172a;color:#fff;text-align:center;}
.container{padding:50px 20px;}
.card{max-width:420px;margin:auto;padding:30px;border-radius:20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(15px);box-shadow:0 10px 40px rgba(0,0,0,0.6);}
.progress{height:10px;background:#1e293b;border-radius:20px;overflow:hidden;margin:25px 0;}
.bar{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#06b6d4);}
button{width:100%;padding:15px;border-radius:50px;border:none;background:#334155;color:#fff;font-weight:600;cursor:not-allowed;}
button.active{background:linear-gradient(90deg,#06b6d4,#3b82f6);cursor:pointer;}
.footer{margin-top:20px;font-size:12px;color:#888;}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🔐 Verificando acesso</h2>
    <p>Preparando seu conteúdo...</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <p id="status">Iniciando...</p>
    <button id="btn" disabled>Continuar</button>
    <div class="footer">Acesso protegido 🔒</div>
  </div>
</div>

<script>
// ❌ pega o link destino da URL
const params = new URLSearchParams(window.location.search);
const destino = params.get("destino");

if(!destino){
  alert("Link inválido!");
  throw "Destino não fornecido";
}

// ❌ codifica para Base64
const encoded = btoa(encodeURIComponent(destino));
sessionStorage.setItem("liberado","1"); // habilita Page2

let tempo = Math.floor(Math.random()*5)+9;
let atual = 0;
const bar = document.getElementById("bar");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

let i = setInterval(()=>{
  atual++;
  bar.style.width = (atual/tempo*100)+"%";

  if(atual < 4) status.innerText = "Conectando...";
  else if(atual < 7) status.innerText = "Verificando...";
  else status.innerText = "Finalizando...";

  if(atual >= tempo){
    clearInterval(i);
    status.innerText = "Acesso liberado!";
    btn.disabled = false;
    btn.classList.add("active");
    btn.onclick = ()=>{ window.location.href="page2.html?d="+encoded; };
  }
},1000);
</script>
</body>
</html>
