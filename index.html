<script>
const links = {
  "abc123": "https://devuploads.com/36lgeo3f83ct",
  "test1": "https://google.com"
};

let tempo = Math.floor(Math.random()*5)+9;
let atual = 0;

const bar = document.getElementById("bar");
const btn = document.getElementById("btn");
const status = document.getElementById("status");

let i = setInterval(()=>{
 atual++;
 bar.style.width = (atual/tempo*100)+"%";

 if(atual >= tempo){
  clearInterval(i);

  status.innerText = "Acesso liberado!";
  btn.disabled = false;
  btn.classList.add("active");

  btn.onclick = ()=>{
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if(!links[id]){
      alert("Link inválido!");
      return;
    }

    sessionStorage.setItem("liberado","1");
    location.href = "page2.html?id=" + id;
  };
 }
},1000);
</script>
