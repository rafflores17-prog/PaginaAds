<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ADS Futurista Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --primary: #06b6d4; --secondary: #3b82f6; --bg: #020617; }
body { margin:0; font-family:'Poppins', sans-serif; background:var(--bg); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { max-width:420px; width:90%; background:rgba(15,23,42,0.8); backdrop-filter:blur(10px); padding:30px; border-radius:24px; border:1px solid rgba(255,255,255,0.1); text-align:center; }
.progress-container { width:100%; height:6px; background:rgba(255,255,255,0.1); border-radius:10px; margin:20px 0; overflow:hidden; }
#progress-bar { width:5%; height:100%; background:linear-gradient(90deg, var(--primary), var(--secondary)); transition:width 0.5s ease; }
h2 { font-size:1.6rem; margin-bottom:10px; }
#status { color:#94a3b8; font-size:0.9rem; margin-bottom:20px; }
button { width:100%; padding:16px; border:none; border-radius:14px; background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; font-weight:700; cursor:pointer; transition:0.3s; }
button:disabled { background:#1e293b; color:#475569; cursor:not-allowed; }
#ad-inner { margin-top:20px; min-height:50px; }
/* Aviso Adblock Suave */
#adblock-msg { display:none; background:rgba(239,68,68,0.2); border:1px solid #ef4444; padding:15px; border-radius:12px; margin-bottom:20px; font-size:0.85rem; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div id="adblock-msg">🛑 <b>Bloqueador Detectado:</b> Por favor, desative o AdBlock para liberar o botão.</div>
    
    <h2>🔐 Acesso Premium</h2>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <p id="status">Verificando conexão...</p>
    
    <div id="step-area">
        <button id="btn1" disabled>Aguarde análise...</button>
    </div>

    <div id="ad-inner">
      <script>
        atOptions = { 'key' : '2f2aa93bee1aa52954a8f17f3434c3db', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
      </script>
      <script src="https://encouragingjawsordinarily.com/2f2aa93bee1aa52954a8f17f3434c3db/invoke.js"></script>
    </div>
  </div>
</div>

<script>
// 1. LÓGICA DE URL (Corrigida para não dar erro no reload)
const params = new URLSearchParams(window.location.search);
let encoded = params.get("d") || params.get("destino") || sessionStorage.getItem("target");

if(encoded) {
    sessionStorage.setItem("target", encoded); // Salva para não perder no reload
    window.history.replaceState({}, document.title, window.location.pathname);
} else {
    document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:50px'>Link expirado ou inválido.</h2>";
}

// 2. ANTI-ADBLOCK EQUILIBRADO
function checkAds() {
    const adArea = document.getElementById("ad-inner");
    const msg = document.getElementById("adblock-msg");
    const btn = document.getElementById("btn1");

    // Verifica se o iframe do anúncio foi criado e tem altura
    setTimeout(() => {
        const hasAd = adArea.offsetHeight > 10;
        if (!hasAd) {
            msg.style.display = "block";
            btn.disabled = true;
            btn.innerText = "Anúncio bloqueado";
        } else {
            msg.style.display = "none";
            btn.disabled = false;
            btn.innerText = "Iniciar Verificação";
            document.getElementById("status").innerText = "Conexão segura estabelecida.";
            progressBar.style.width = "30%";
        }
    }, 1500); // Dá um tempo maior para carregar
}
window.onload = checkAds;

// 3. ETAPAS (Sua lógica original limpa)
const progressBar = document.getElementById("progress-bar");
const stepArea = document.getElementById("step-area");

document.getElementById("btn1").onclick = function() {
    this.style.display = "none";
    progressBar.style.width = "60%";
    document.getElementById("status").innerText = "Gerando link de acesso...";
    
    let count = 3;
    const timerBtn = document.createElement("button");
    timerBtn.disabled = true;
    timerBtn.innerText = `Aguarde ${count}s...`;
    stepArea.appendChild(timerBtn);

    const itv = setInterval(() => {
        count--;
        timerBtn.innerText = `Aguarde ${count}s...`;
        if(count <= 0) {
            clearInterval(itv);
            timerBtn.innerText = "Ir para Etapa Final";
            timerBtn.disabled = false;
            timerBtn.onclick = etapa2;
        }
    }, 1000);
};

function etapa2() {
    window.open("https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f", '_blank');
    progressBar.style.width = "100%";
    stepArea.innerHTML = '<button id="btn-final">Acessar Destino</button>';
    document.getElementById("btn-final").onclick = () => {
        const destino = decodeURIComponent(atob(sessionStorage.getItem("target")));
        window.location.replace(destino);
    };
}
</script>
</body>
</html>
