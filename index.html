<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal ADS Futurista Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:#fff;
  text-align:center;
}
.container{padding:40px 20px;}
.card{
  max-width:500px;
  margin:auto;
  background:rgba(0,0,0,0.85);
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
h2{font-weight:700;margin-bottom:10px;}
button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:none;
  border-radius:50px;
  background:linear-gradient(90deg,#06b6d4,#3b82f6);
  color:#fff;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
button:hover{opacity:0.9;}
button:disabled { background: #555; cursor: not-allowed; color: #999; }
#ad-banner{margin:20px auto; min-height: 50px;}
#adblock-popup{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  z-index:9999;
  color:#fff;
  font-size:18px;
  text-align:center;
  padding:50px 20px;
  backdrop-filter: blur(5px);
}
#adblock-popup button{
  margin-top:20px;
  background:#22c55e;
  padding:10px 20px;
  border-radius:20px;
  border:none;
  cursor:pointer;
}
.footer{
  margin-top:20px;
  font-size:12px;
  color:#888;
}
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🔐 Acesso Protegido</h2>
    <p id="status">Verificando conexão...</p>
    <button id="btn1" disabled>Liberar Acesso</button>
    <div id="step2"></div>

    <div id="ad-banner">
      <script>
        atOptions = {
          'key' : '2f2aa93bee1aa52954a8f17f3434c3db',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://encouragingjawsordinarily.com/2f2aa93bee1aa52954a8f17f3434c3db/invoke.js"></script>
      <script src="https://quge5.com/88/tag.min.js" data-zone="223644" async data-cfasync="false"></script>
      <script src="https://encouragingjawsordinarily.com/09/bc/0d/09bc0d1e4e41282a10b229106cc5a841.js"></script>
    </div>

    <div class="footer">© 2026 Portal ADS Futurista Premium</div>
  </div>
</div>

<div id="adblock-popup">
  <h2>🚨 AdBlocker Detectado!</h2>
  <p>Por favor, desative sua extensão de bloqueio de anúncios para liberar o acesso ao link.</p>
  <button onclick="closeAdblock()">Ok, já desativei</button>
</div>

<script>
// ===== DESTINO FLEXÍVEL =====
const params = new URLSearchParams(window.location.search);
let encoded = params.get("d") || params.get("destino");

if(!encoded){
  alert("Link inválido!");
  throw new Error();
}

// Oculta Base64 na barra
window.history.replaceState({}, document.title, window.location.pathname);

// ===== ELEMENTOS =====
const btn1 = document.getElementById("btn1");
const step2 = document.getElementById("step2");
const status = document.getElementById("status");
const adblockPopup = document.getElementById("adblock-popup");

// ===== Anti-AdBlock (CORRIGIDO) =====
function closeAdblock(){ 
  // O usuário diz que desativou, então recarregamos a página para conferir
  window.location.reload(); 
}

window.addEventListener("load", ()=>{
  // Cria uma isca super agressiva para atrair os bloqueadores
  let adTest = document.createElement('div');
  adTest.innerHTML = '&nbsp;';
  adTest.className = 'ad ads ad-banner doubleclick sponsor pub_300x250';
  adTest.style.position = 'absolute';
  adTest.style.top = '-999px';
  document.body.appendChild(adTest);

  // Aumentei o tempo para 600ms para dar tempo do banner real tentar carregar
  setTimeout(()=>{
    const adBanner = document.getElementById('ad-banner');
    
    // Se a isca sumiu OU o banner real tem altura menor que 10px (bloqueado)
    if(adTest.offsetHeight === 0 || (adBanner && adBanner.offsetHeight < 10)){ 
      adblockPopup.style.display = 'block'; 
    } else { 
      btn1.disabled = false;
      status.innerText = "Clique abaixo para liberar";
    }
    adTest.remove();
  }, 600);
});

// ===== ETAPA 1 =====
btn1.onclick = ()=>{
  btn1.style.display="none";
  status.innerText="Preparando conteúdo...";
  let count=3;
  const btn2=document.createElement("button");
  btn2.innerText="Aguarde 3s...";
  step2.appendChild(btn2);

  const timer1=setInterval(()=>{
    count--;
    btn2.innerText="Aguarde "+count+"s...";
    if(count<=0){
      clearInterval(timer1);
      btn2.innerText="Continuar";
      btn2.onclick=etapa2;
    }
  },1000);
};

// ===== ETAPA 2 =====
function etapa2(){
  step2.innerHTML="";
  status.innerText="Quase pronto...";

  const btn3=document.createElement("button");
  btn3.innerText="Aguarde 3s...";
  step2.appendChild(btn3);

  // Pop-up Monetização
  const smartlink="https://encouragingjawsordinarily.com/fxgzhb5e?key=3823c25827101f6ca9e1188db300506f";
  window.open(smartlink,'_blank');

  let count=3;
  const timer2=setInterval(()=>{
    count--;
    btn3.innerText="Aguarde "+count+"s...";
    if(count<=0){
      clearInterval(timer2);
      btn3.innerText="Clique para continuar";
      btn3.onclick=finalStep;
    }
  },1000);
}

// ===== ETAPA FINAL =====
function finalStep(){
  step2.innerHTML="";
  status.innerText="Quase lá...";
  const btnFinal=document.createElement("button");
  btnFinal.innerText="Clique para ir ao destino";
  step2.appendChild(btnFinal);

  btnFinal.onclick=()=>{
    const destino=decodeURIComponent(atob(encoded));
    window.location.replace(destino);
  };
}
</script>
</body>
</html>
